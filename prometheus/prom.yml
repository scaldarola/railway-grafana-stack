global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'ballcoach-api'
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'https://ballcoach-api-production.up.railway.app:8080'
